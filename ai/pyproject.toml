[project]
name = "aisvc"
# Placeholder: the release version is ai/package.json's, which Changesets bumps and the image build stamps.
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "ai-gen",
    "grpcio>=1.84.0",
    "grpcio-health-checking>=1.84.0",
    "protobuf>=7.36.2,<8",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
    "types-grpcio>=1.84.0.20260928",
    "types-grpcio-health-checking>=1.0.0.20260518",
    "watchfiles>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisvc"]
# Written by the image build and gitignored; hatchling drops VCS-ignored files unless listed here.
artifacts = ["src/aisvc/platform/_buildinfo.py"]

[tool.uv.sources]
ai-gen = { path = "gen", editable = true }

[tool.ruff]
extend-exclude = ["gen"]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# buf's stubs cover the _pb2 modules only; the _pb2_grpc functions stay untyped.
untyped_calls_exclude = ["ai.v1"]

[tool.importlinter]
root_package = "aisvc"

[[tool.importlinter.contracts]]
name = "Layers: composition root, rpc, modules, platform"
type = "layers"
layers = [
    "aisvc.__main__",
    "aisvc.rpc",
    "aisvc.modules",
    "aisvc.platform",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1"
