# Wraps buf's generated output as an installable package; see proto/README.md before moving it.
[project]
name = "ai-gen"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai"]
